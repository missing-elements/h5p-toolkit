packages:
  - packages/*
  - apps/*

# pnpm 10 runs no install script unless it is named here. esbuild's only verifies its binary;
# @vscode/vsce-sign's installs the signing binary that `vsce publish` signs the extension with.
onlyBuiltDependencies:
  - '@vscode/vsce-sign'
  - esbuild

# Named so the install says nothing about them: h5p-standalone's script is a yarn-only guard, and
# workerd's only checks its binary, which comes as an optional dependency.
ignoredBuiltDependencies:
  - h5p-standalone
  - workerd

overrides:
  # @azure/identity's ^6 range has no msal-node past GHSA-xcx6-jx8p-x3h5 (Dependabot #3): 7.1.0 is
  # the first. Remove once @azure/identity takes 7.
  '@azure/identity>@azure/msal-node': ^7.1.0
  # vsce's minimatch ^10 has GHSA-g3hv-75wg-m249 (Dependabot #4), fixed in 11.0.1; vsce calls only
  # minimatch(path, pattern, { dot: true }), which 11 keeps. Remove once vsce takes 11.
  '@vscode/vsce>minimatch': ^11.0.1
