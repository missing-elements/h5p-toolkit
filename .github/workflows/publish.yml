name: Publish to npm

# Publishes every package whose version npm lacks, by trusted publishing, so no token is stored.
# Each package's npmjs.com registration names this file and the `npm` environment: keep both names.

on:
  # By hand, from main, once the bump is pushed; before a player release, run ci.yml first and wait
  # for green (design/build.md).
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check every package that would be published, and publish none
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    # The environment deploys from main alone, and each registration names it, so a run from any
    # other branch is not trusted.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      # Node 24: npm takes a trusted publisher's token from 11.5.1, which Node 22's npm lacks. No
      # registry-url: setup-node would write a placeholder token for it, which nothing here needs.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No cache, as in vscode-publish.yml: a publishing job installs against the lockfile's
          # hashes, not a store another run wrote.
          package-manager-cache: false
      - name: Check that npm can publish by trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm ${process.argv[1]} cannot publish by trusted publishing: it needs 11.5.1 or later`)
              process.exit(1)
            }
          ' "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      # The author, verify, mcp and embed packages' prepublishOnly run browser tests, as ci.yml's
      # test jobs do, and install Chromium the same way.
      - run: pnpm --filter @missing-elements/h5p-offline-player exec playwright install chromium
      # `publish` takes no --workspace-concurrency: pnpm stopped on it before publishing anything.
      # No git checks: prepack writes into the tree, and the environment holds the run to main.
      - run: pnpm -r publish --access public --no-git-checks $DRY_RUN
        env:
          NPM_CONFIG_PROVENANCE: true
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          # Minutes a check waits for npm to serve a dependency published earlier in this run: npm
          # processes it first, 14 for the 31 MB library pack in 1.7.0 (#253). A dry run waits none.
          H5P_PUBLISH_WAIT: ${{ inputs.dry-run && '0' || '30' }}
