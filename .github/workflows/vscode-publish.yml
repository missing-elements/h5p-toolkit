name: Publish the VS Code extension

# Publishes H5P Preview to Open VSX by trusted publishing, so no token is stored. The registration
# on Open VSX names this file and the `open-vsx` environment: rename, re-register.

on:
  # By hand, from main, once packages/vscode/package.json has a new version: Open VSX refuses a
  # version it already has.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-vsx:
    name: Open VSX
    runs-on: ubuntu-latest
    # The environment deploys from main alone, and the registration names it, so a run from any
    # other branch is not trusted.
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      # No cache: a publishing job installs against the lockfile's hashes, not another run's store.
      # setup-node v5 restores ci.yml's store whenever package.json names a package manager.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The player and the runtime, which the extension carries.
      - run: pnpm build
      - run: pnpm --filter h5p-preview package
      # The .vsix as ci.yml's `vscode` job builds it, kept for the Marketplace's upload.
      - uses: actions/upload-artifact@v4
        with:
          name: h5p-preview-vsix
          path: packages/vscode/*.vsix
      - run: pnpm exec ovsx publish *.vsix --trusted-publishing
        working-directory: packages/vscode
