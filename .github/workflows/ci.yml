name: CI

# A pull request or a push tests, in Chromium, the packages it changes and those that depend on
# them, a lane per job. The weekly run and a run by hand test everything, in Firefox and WebKit too.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - '*.md'
      - LICENSE
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - '*.md'
      - LICENSE
  # Everything, and the week's caches saved on main, which pull requests restore.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The player's browser files that wait out real time run weekly and by hand only
  # (packages/player/vite.config.ts).
  H5P_TEST_SKIP_SLOW: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '1' || '' }}

jobs:
  # The heavy packages get a lane each, the rest share one. A change picks its packages and their
  # dependents; a file outside packages/, apps/, skills/ and docs picks all: its reach is unknown.
  scope:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.scope.outputs.lanes }}
      demo: ${{ steps.scope.outputs.demo }}
      vscode: ${{ steps.scope.outputs.vscode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      # bash by name, which adds pipefail: a pnpm that fails must fail the run, not pick nothing.
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=false; weekly=false; base=; changed=
          case "$EVENT" in
            # A pull request's run checks out the merge commit, whose first parent is main.
            pull_request) base=HEAD^1 ;;
            # Where main was before the push; a new or forced branch may have nothing to compare.
            push) if git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; else all=true; fi ;;
            *) all=true; weekly=true ;;
          esac
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
            if grep -qvE '^(packages|apps|skills|design|docs)/|^[^/]+\.md$|^LICENSE$' <<< "$changed"; then all=true; fi
          fi
          # pnpm counts a file outside the packages as the root's, whose test script tests them all.
          names() { pnpm "$@" ls --depth -1 --json | jq -r --arg root "$PWD" '.[] | select(.path != $root) | .name'; }
          if [ "$all" = true ]; then
            picked=$(names -r)
          else
            picked=$(names --filter "...[$base]")
            # The skills are tested from apps/skills, and h5p-author's ships in the author package.
            if grep -q '^skills/' <<< "$changed"; then
              picked=$(printf '%s\n' $picked @missing-elements/h5p-author @missing-elements/h5p-skills)
            fi
          fi
          lanes=$(printf '%s\n' $picked | jq -Rsc '
            (split("\n") | map(select(. != "")) | unique) as $picked
            | ["@missing-elements/h5p-offline-player", "@missing-elements/h5p-verify",
               "@missing-elements/h5p-skills", "@missing-elements/h5p-embed"] as $heavy
            | [$heavy[] | select(IN($picked[])) | {name: sub("@missing-elements/h5p-(offline-)?"; ""), select: "--filter \(.)"}]
              + ([$picked[] | select(IN($heavy[]) | not)]
                 | if length > 0 then [{name: "other", select: (map("--filter \(.)") | join(" "))}] else [] end)')
          demo=false
          if grep -qx @missing-elements/h5p-demo <<< "$picked"; then demo=true; fi
          vscode=$weekly
          if grep -q '^packages/vscode/' <<< "$changed"; then vscode=true; fi
          printf '%s\n' "lanes=$lanes" "demo=$demo" "vscode=$vscode" | tee -a "$GITHUB_OUTPUT"

  # What the packages share: the demo built as Vercel builds it, every type check, the player's
  # build.
  checks:
    needs: scope
    if: needs.scope.outputs.lanes != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo first, from a checkout with nothing built, as Vercel builds it. Run after `pnpm
      # build`, it found the player's dist/ there, and passed while the deploy of #123 failed.
      - if: needs.scope.outputs.demo == 'true'
        run: pnpm build:demo
      # No comment past two lines: design/build.md.
      - run: pnpm comments
      # Every package that has a type check, whatever the change: each one's check writes the
      # types the packages after it read.
      - run: pnpm typecheck
      - run: pnpm build

  # The tests in Chromium, a lane per job. Each package's test script builds what it needs.
  test:
    name: test (${{ matrix.lane.name }})
    needs: scope
    if: needs.scope.outputs.lanes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.scope.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No --with-deps: the runner image ships Chrome, so Chromium's libraries are there, and a
      # headless suite uses none of apt's extras. Some mirrors ran at 40 kB/s, 20 minutes (#73).
      - run: pnpm --filter @missing-elements/h5p-offline-player exec playwright install chromium
      - run: pnpm $SELECT --workspace-concurrency=1 test
        env:
          SELECT: ${{ matrix.lane.select }}

  # The player's browser suite and the app's tests in Firefox and WebKit, weekly and by hand. One
  # engine per job: they share the dev server's switches and would flip them under each other.
  engines:
    name: browser suite (${{ matrix.browser }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      H5P_TEST_BROWSER: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # WebKit needs its system packages, GStreamer among them. Firefox, like Chromium, has its
        # libraries from the runner image.
        include:
          - browser: webkit
            deps: --with-deps
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit's packages are 117 MB from a mirror some runners reach at 40 kB/s (#77), so apt's
      # archive is cached by week; it is made writable as the restore runs as the runner's user.
      - if: matrix.deps
        id: apt
        run: |
          sudo chmod a+w /var/cache/apt/archives
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - if: matrix.deps
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.browser }}-${{ steps.apt.outputs.week }}
          restore-keys: apt-${{ matrix.browser }}-
      # Playwright installs WebKit's packages through apt. Retry transient Ubuntu mirror failures.
      - run: |
          for attempt in 1 2 3; do
            if pnpm --filter @missing-elements/h5p-offline-player exec playwright install ${{ matrix.deps }} ${{ matrix.browser }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser installation failed; retrying in 30 seconds ($attempt/3)."
              sleep 30
            fi
          done
          exit 1
      # Drops the versions Ubuntu has since replaced, so the cache holds one copy of each package
      # rather than every week's.
      - if: matrix.deps
        run: sudo apt-get autoclean
      - run: pnpm test:engine

  # The extension in a real VS Code under Xvfb, and the .vsix the owner publishes, built from what
  # the tests ran against. Its unit tests run with the other packages'.
  vscode:
    name: VS Code extension
    needs: scope
    if: needs.scope.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The player and the runtime, which the extension carries.
      - run: pnpm build
      # The editor the tests download, about 150 MB, a new stable a month: kept a week at a time.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: packages/vscode/.vscode-test
          key: vscode-test-${{ steps.week.outputs.week }}
          restore-keys: vscode-test-
      - run: xvfb-run -a pnpm --filter h5p-preview test:vscode
      - run: pnpm --filter h5p-preview package
      - uses: actions/upload-artifact@v4
        with:
          name: h5p-preview-vsix
          path: packages/vscode/*.vsix
