version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # vsce refuses to package an extension whose @types/vscode is newer than its engines.vscode.
      # The two move together, by hand (#128).
      - dependency-name: "@types/vscode"
